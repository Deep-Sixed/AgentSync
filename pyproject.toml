[project]
name = "agentsync"
version = "0.1.0"
description = "Rule + Skill + Skill-Acquisition control plane for AI agents. Exposed through ContextForge (IBM MCP gateway) as the network door; AgentSync is the system."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0,<2"]  # FastMCP transport — required to run agentsync.mcp.server; mcp 2 renamed FastMCP
dev = ["pytest>=8.0", "mcp[cli]>=1.0,<2", "anyio>=4.0"]
# Pinned: EvecorStelePort targets this ledger API (create_pending(parser=...) -> seal).
stele = ["stele @ git+https://github.com/Deep-Sixed/Stele@10bbf3f24a4cd4b15fc501c57ce58bb2fcf7b54a"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsync"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
