[project]
name = "agentsync"
version = "0.1.0"
description = "Rule + Skill + Skill-Acquisition control plane for AI agents. Exposed through ContextForge (IBM MCP gateway) as the network door; AgentSync is the system."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0"]     # FastMCP transport — required to run agentsync.mcp.server
dev = ["pytest>=8.0", "mcp[cli]>=1.0", "anyio>=4.0"]
stele = ["stele @ file:///mnt/jarvis-data/projects/Stele"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsync"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
